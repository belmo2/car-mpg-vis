<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Car Makes: Fuel Efficiency (2017)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .annotation { fill: rgb(161,2,2); font-size:16px; font-weight:bold; }
    .bar { fill: rgb(80,147,201); }
    .highlight { fill: rgb(249,169,21); }
    .x-axis-labels text { font-size:12px; }
    .mpg-label { font-size:11px; fill:#222; }
    .scene-nav { margin:1em 0; }
  </style>
</head>
<body>
  <div id="vis"></div>
  <div class="scene-nav">
    <button id="prev">Previous</button>
    <span id="scene-label"></span>
    <button id="next">Next</button>
  </div>

  <script>
    let scene = 0, makes, topMakes;
    const scenes = [drawScene0, drawScene1, drawScene2];
    const w = 1200, h = 550, mT = 50, mB = 130, mL = 90, mR = 90;

    // Load & preprocess CSV once (local file)
    d3.csv("cars2017.csv")
      .then(raw => {
        makes = d3.groups(raw, d => d.Make).map(([make, rows]) => ({
          make,
          avgMPG: d3.mean(rows, r => (+r.AverageCityMPG + +r.AverageHighwayMPG) / 2),
          rows
        }))
        .sort((a, b) => d3.descending(a.avgMPG, b.avgMPG));
        topMakes = makes.slice(0, 3).map(d => d.make);
        updateScene();
      })
      .catch(err => console.error("Failed to load cars2017.csv:", err));

    // Scene 1: Overview
    function drawScene0() {
      d3.select("#scene-label").text("Scene 1: Average MPG by Make");
      const svg = d3.select("#vis").append("svg").attr("width", w).attr("height", h);
      const x = d3.scaleBand().domain(makes.map(d => d.make)).range([mL, w-mR]).padding(0.2);
      const y = d3.scaleLinear().domain([0, d3.max(makes, d=>d.avgMPG)]).range([h-mB, mT]);

      svg.selectAll("rect.bar").data(makes).join("rect")
        .attr("class","bar")
        .attr("x", d=>x(d.make))
        .attr("y", d=>y(d.avgMPG))
        .attr("width", x.bandwidth())
        .attr("height", d=>y(0)-y(d.avgMPG));

      svg.append("g")
        .attr("class","x-axis-labels")
        .attr("transform", `translate(0,${h-mB})`)
        .call(d3.axisBottom(x).tickSizeOuter(0))
        .selectAll("text")
          .attr("transform","rotate(-65)")
          .attr("dx","-0.8em")
          .attr("dy","0.15em")
          .style("text-anchor","end");

      svg.append("g")
        .attr("transform", `translate(${mL},0)`)
        .call(d3.axisLeft(y));

      svg.append("text")
        .attr("x", w/2).attr("y", mT/2).attr("text-anchor","middle").attr("font-size","18px")
        .text("Average Fuel Efficiency (MPG) by Car Make");

      svg.append("text")
        .attr("x", w/2).attr("y", mT/2 + 22).attr("text-anchor","middle")
        .attr("font-size","14px").attr("fill","#444")
        .text("Use Next/Previous to explore.");
    }

    // Scene 2: Top 3
    function drawScene1() {
      d3.select("#scene-label").text("Scene 2: Top 3 Fuel Efficient Makes");
      const svg = d3.select("#vis").append("svg").attr("width", w).attr("height", h);
      const x = d3.scaleBand().domain(makes.map(d => d.make)).range([mL, w-mR]).padding(0.2);
      const y = d3.scaleLinear().domain([0, d3.max(makes, d=>d.avgMPG)]).range([h-mB, mT]);

      svg.selectAll("rect.bar").data(makes).join("rect")
        .attr("class", d => topMakes.includes(d.make) ? "bar highlight" : "bar")
        .attr("x", d=>x(d.make))
        .attr("y", d=>y(d.avgMPG))
        .attr("width", x.bandwidth())
        .attr("height", d=>y(0)-y(d.avgMPG));

      svg.append("g")
        .attr("class","x-axis-labels")
        .attr("transform", `translate(0,${h-mB})`)
        .call(d3.axisBottom(x).tickSizeOuter(0))
        .selectAll("text")
          .attr("transform","rotate(-65)")
          .attr("dx","-0.8em")
          .attr("dy","0.15em")
          .style("text-anchor","end");

      svg.append("g")
        .attr("transform", `translate(${mL},0)`)
        .call(d3.axisLeft(y));

      makes.slice(0,3).forEach((d,i) => {
        svg.append("text")
          .attr("x", x(d.make) + x.bandwidth()/2)
          .attr("y", y(d.avgMPG) - 10)
          .attr("class","annotation")
          .attr("text-anchor","middle")
          .text(`#${i+1}`);
      });

      svg.append("text")
        .attr("x", w/2).attr("y", mT/2).attr("text-anchor","middle").attr("font-size","18px")
        .text("Top 3 Fuel Efficient Makes");

      svg.append("text")
        .attr("x", w/2).attr("y", mT/2+22).attr("text-anchor","middle")
        .attr("font-size","14px").attr("fill","#444")
        .text("Highlighted and ranked.");
    }

    // Scene 3: Drill‑down prompt
    function drawScene2() {
      d3.select("#scene-label").text("Scene 3: Compare City & Highway MPG");
      const svg = d3.select("#vis").append("svg").attr("width", w).attr("height", h);
      const x = d3.scaleBand().domain(makes.map(d=>d.make)).range([mL, w-mR]).padding(0.2);
      const y = d3.scaleLinear().domain([0, d3.max(makes, d=>d.avgMPG)]).range([h-mB, mT]);

      svg.selectAll("rect.bar").data(makes).join("rect")
        .attr("class","bar")
        .attr("x", d=>x(d.make))
        .attr("y", d=>y(d.avgMPG))
        .attr("width", x.bandwidth())
        .attr("height", d=>y(0)-y(d.avgMPG))
        .on("click", (e,d) => showComparison(d));

      svg.append("g")
        .attr("class","x-axis-labels")
        .attr("transform", `translate(0,${h-mB})`)
        .call(d3.axisBottom(x).tickSizeOuter(0))
        .selectAll("text")
          .attr("transform","rotate(-65)")
          .attr("dx","-0.8em")
          .attr("dy","0.15em")
          .style("text-anchor","end");

      svg.append("g")
        .attr("transform", `translate(${mL},0)`)
        .call(d3.axisLeft(y));

      svg.append("text")
        .attr("x", w/2).attr("y", mT/2).attr("text-anchor","middle").attr("font-size","18px")
        .text("Click a Make to Compare Its Avg City & Hwy MPG");

      svg.append("text")
        .attr("x", w/2).attr("y", mT/2+22).attr("text-anchor","middle")
        .attr("font-size","14px").attr("fill","#444")
        .text("Drill‑down shows average city vs highway MPG for that make.");
    }

    // Drill‑down: showComparison
    function showComparison(makeObj) {
      d3.select(".scene-nav").style("display","none");
      d3.select("#vis").html("");

      const w2=800, h2=400, mT2=50, mB2=100, mL2=100, mR2=50;
      const svg = d3.select("#vis").append("svg").attr("width",w2).attr("height",h2);

      const cityAvg = d3.mean(makeObj.rows, r=>+r.AverageCityMPG);
      const hwAvg   = d3.mean(makeObj.rows, r=>+r.AverageHighwayMPG);
      const data = [
        {type:"City MPG", mpg:cityAvg},
        {type:"Highway MPG", mpg:hwAvg}
      ];

      const x2 = d3.scaleBand().domain(data.map(d=>d.type)).range([mL2, w2-mR2]).padding(0.4);
      const y2 = d3.scaleLinear().domain([0, d3.max(data, d=>d.mpg)]).range([h2-mB2, mT2]);

      svg.selectAll("rect").data(data).join("rect")
        .attr("class","bar")
        .attr("x", d=>x2(d.type))
        .attr("y", d=>y2(d.mpg))
        .attr("width", x2.bandwidth())
        .attr("height", d=>y2(0)-y2(d.mpg));

      svg.append("g").attr("transform",`translate(0,${h2-mB2})`).call(d3.axisBottom(x2));
      svg.append("g").attr("transform",`translate(${mL2},0)`).call(d3.axisLeft(y2));

      svg.append("text")
        .attr("x",w2/2).attr("y",mT2/2).attr("text-anchor","middle").attr("font-size","18px")
        .text(`City vs Highway MPG for ${makeObj.make}`);

      svg.selectAll("text.mpg-label").data(data).join("text")
        .attr("class","mpg-label")
        .attr("x", d=>x2(d.type)+x2.bandwidth()/2)
        .attr("y", d=>y2(d.mpg)-8)
        .attr("text-anchor","middle")
        .text(d=>d.mpg.toFixed(1));

      d3.select("#vis").append("button")
        .text("Back to Makes")
        .on("click", ()=>{
          d3.select(".scene-nav").style("display",null);
          updateScene();
        });
    }

    function updateScene(){
      d3.select("#vis").html("");
      d3.select(".scene-nav").style("display",null);
      scenes[scene]();
    }

    d3.select("#prev").on("click", ()=>{ if(scene>0){scene--;updateScene();}});
    d3.select("#next").on("click", ()=>{ if(scene<scenes.length-1){scene++;updateScene();}});

  </script>
</body>
</html>
